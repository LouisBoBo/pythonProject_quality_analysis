# PCB 品质分析 — 同机安全 Nginx（仅新增 18780，不动 80/443）
# ============================================================
# 本文件：
#   ✓ 只 listen 18780
#   ✗ 绝不 listen 80 / 443
#   ✗ 不改 default / 现有 server
#
# 请用专用脚本启用（含预检 + nginx -t，失败则回滚）：
#   sudo bash deploy/enable-nginx-safe.sh /opt/pcb-quality
# ============================================================

# 名称带端口，降低与其它 upstream 重名冲突
upstream pcb_qa_api_18765 {
    server 127.0.0.1:18765;
    keepalive 8;
}

server {
    listen 18780;
    listen [::]:18780;
    server_name _;

    client_max_body_size 32m;

    # 宝塔常用 /www/wwwlogs；若目录不存在请先 mkdir
    access_log /www/wwwlogs/pcb-quality-18780.access.log;
    error_log  /www/wwwlogs/pcb-quality-18780.error.log;

    location / {
        proxy_pass http://pcb_qa_api_18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    location /download/ {
        proxy_pass http://pcb_qa_api_18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }

    location = /api/health {
        proxy_pass http://pcb_qa_api_18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
